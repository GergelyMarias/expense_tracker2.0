<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Edit Investment</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f6fa; padding: 2em; color: #2f3640; }
        .card { background: white; padding: 2rem; border-radius: 12px; max-width: 600px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; font-weight: bold; color: #40739e; }
        input, select { width: 100%; padding: 10px; border: 1px solid #dcdde1; border-radius: 6px; box-sizing: border-box; }
        .btn { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; }
        .btn-save { background: #4161ca; color: white; margin-bottom: 10px; }
        .btn-back { background: #7f8c8d; color: white; text-decoration: none; display: block; text-align: center; line-height: 40px; height: 40px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>✏️ Edit Investment Record</h2>
        <form method="POST">
            
            <div class="form-row">
                <div><label>Date</label><input type="date" name="date" value="{{ inv.date }}" required></div>
                <div><label>Ticker</label><input type="text" name="ticker" value="{{ inv.ticker }}" required></div>
            </div>

            
            <div class="form-row">
                <div><label>Side</label>
                    <select name="order_category">
                        <option value="BUY" {% if inv.order_category == 'BUY' %}selected{% endif %}>BUY</option>
                        <option value="SELL" {% if inv.order_category == 'SELL' %}selected{% endif %}>SELL</option>
                    </select>
                </div>
                <div><label>Shares</label><input type="number" name="nr_shares" step="0.0001" value="{{ inv.nr_shares }}" required></div>
            </div>

            
            <div class="form-row">
                <div><label>Price</label><input type="number" name="order_price" step="0.01" value="{{ inv.order_price }}" required></div>
                <div><label>Currency</label>
                    <select name="currency">
                        <option value="HUF" {% if inv.currency == 'HUF' %}selected{% endif %}>HUF</option>
                        <option value="EUR" {% if inv.currency == 'EUR' %}selected{% endif %}>EUR</option>
                        <option value="USD" {% if inv.currency == 'USD' %}selected{% endif %}>USD</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div><label>/HUF Rate</label><input type="number" name="huf_rate" step="0.01" value="{{ inv.huf_rate }}" required></div>
                <div><label>Platform</label><input type="text" name="platform" value="{{ inv.platform }}"></div>
            </div>

           
            <div style="margin-bottom: 20px;">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <input type="checkbox" name="tbsz" style="width: auto;" {% if inv.tbsz %}checked{% endif %}> 
                    TBSZ Account
                </label>
            </div>
            
            <button type="submit" class="btn btn-save">Update Record</button>
            <a href="/investment?month={{ selected_month }}" class="btn btn-back">Cancel</a>
        </form>
    </div>
</body>
</html>
