<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Expense Tracker</title>
    <style>
        /* Consistent with your dashboard style */
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f5f6fa 0%, #dcdde1 100%); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            color: #2f3640;
        }

        .login-card { 
            background: white; 
            padding: 3rem; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            max-width: 400px; 
            width: 90%;
            text-align: center;
        }

        .icon-circle {
            width: 70px;
            height: 70px;
            background: #40739e;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem auto;
            box-shadow: 0 4px 10px rgba(64, 115, 158, 0.3);
        }

        h2 { 
            font-size: 1.5rem; 
            margin-bottom: 0.5rem; 
            color: #2f3640;
        }

        p.subtitle {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        input[type="password"] { 
            width: 100%; 
            padding: 12px 15px; 
            border: 2px solid #f1f2f6; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 1rem;
            margin-bottom: 1.5rem;
            transition: border-color 0.3s;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: #40739e;
        }

        .btn-login { 
            width: 100%;
            padding: 12px; 
            background: #40739e; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem;
            transition: background 0.3s;
        }

        .btn-login:hover { 
            background: #2f3640; 
        }

        .error-msg { 
            color: #e84118; 
            background: #fdecea;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-top: 1rem;
        }

        /* Branding footer */
        .footer-brand {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #bdc3c7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="icon-circle">🔒</div>
    <h2>AGE </h2>
    <p class="subtitle">Finance Application</p>
    
    <form method="POST">
        <input type="password" name="password" placeholder="••••••••" required autofocus>
        <button type="submit" class="btn-login">Login</button>
    </form>

    {% if error %}
        <div class="error-msg">
            ⚠️ {{ error }}
        </div>
    {% endif %}

    <div class="footer-brand">
        Secured by AGE
    </div>
</div>

</body>
</html>
