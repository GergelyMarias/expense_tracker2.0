<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f5f7; --surface: #ffffff; --line: #e6e8ec; --line-soft: #f0f1f4;
            --text: #1f2430; --text-2: #5b6272; --muted: #9aa1ae; --accent: #40739e; --accent-bg: #eaf0f6;
            --good: #1f8a5b; --bad: #d14343; --bad-bg: #fcecec;
            --radius: 16px; --shadow: 0 1px 2px rgba(20,30,50,.04), 0 8px 32px rgba(20,30,50,.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
            font-family: 'Inter', -apple-system, sans-serif; color: var(--text);
            background: radial-gradient(900px 500px at 50% -10%, #e3ebf3 0%, var(--bg) 60%);
        }
        .card {
            width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 2.2rem 2rem 1.6rem; animation: rise .5s cubic-bezier(.2,.7,.2,1) both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
        .logo { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-size: 1.3rem; background: var(--accent-bg); margin-bottom: 1.1rem; }
        h1 { margin: 0; font-size: 1.35rem; font-weight: 800; }
        .sub { margin: .25rem 0 1.6rem; color: var(--muted); font-size: .88rem; }

        label.lbl { display: block; font-size: .75rem; font-weight: 600; color: var(--text-2); margin-bottom: .35rem; }
        .pw { position: relative; }
        input[type="password"], input[type="text"] {
            width: 100%; padding: .8rem 2.8rem .8rem .9rem; border-radius: 11px; font: inherit; font-size: .95rem; letter-spacing: .02em;
            background: #fafbfc; color: var(--text); border: 1px solid var(--line); transition: border-color .2s, box-shadow .2s, background .2s;
        }
        input:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(64,115,158,.12); }
        .peek { position: absolute; right: .45rem; top: 50%; transform: translateY(-50%); border: none; background: none; cursor: pointer; font-size: 1rem; padding: .35rem; border-radius: 7px; color: var(--muted); }
        .peek:hover { background: var(--line-soft); }

        /* Hide amounts switch */
        .privacy {
            display: flex; align-items: center; gap: .9rem; margin: 1.1rem 0 1.3rem; padding: .85rem .95rem;
            border: 1px solid var(--line); border-radius: 12px; background: #fafbfc; cursor: pointer; transition: border-color .2s, background .2s;
        }
        .privacy:hover { border-color: #d5dbe2; }
        .privacy.on { border-color: #c8d7e5; background: var(--accent-bg); }
        .privacy .txt { flex: 1; }
        .privacy b { display: block; font-size: .88rem; }
        .privacy small { display: block; font-size: .75rem; color: var(--text-2); margin-top: .1rem; line-height: 1.35; }
        .switch { position: relative; width: 42px; height: 24px; flex: none; }
        .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
        .switch span { position: absolute; inset: 0; border-radius: 999px; background: #d5dbe2; transition: .2s; }
        .switch span::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: .2s; }
        .switch input:checked + span { background: var(--accent); }
        .switch input:checked + span::before { transform: translateX(18px); }
        .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

        .btn { width: 100%; border: none; border-radius: 11px; padding: .85rem; font: inherit; font-weight: 700; font-size: .95rem; color: #fff; background: var(--accent); cursor: pointer; transition: background .2s, transform .1s; }
        .btn:hover { background: #355f84; }
        .btn:active { transform: translateY(1px); }

        .error { margin-top: 1rem; padding: .7rem .9rem; border-radius: 10px; background: var(--bad-bg); color: #8f2a2a; font-size: .85rem; border: 1px solid #f3c9c9; }
        .foot { margin-top: 1.6rem; text-align: center; font-size: .7rem; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
        @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
    </style>
</head>
<body>

<main class="card">
    <div class="logo">🔒</div>
    <h1>Finance</h1>
    <p class="sub">Sign in to continue</p>

    <form method="POST">
        <label class="lbl" for="password">Password</label>
        <div class="pw">
            <input type="password" name="password" id="password" placeholder="••••••••" required autofocus autocomplete="current-password">
            <button type="button" class="peek" id="peek" aria-label="Show password" title="Show password">👁</button>
        </div>

        <label class="privacy" id="privacyRow" for="hideAmounts">
            <span class="txt">
                <b>Hide amounts</b>
                <small>Blur every money value after signing in. Percentages stay visible. You can change it later in Settings.</small>
            </span>
            <span class="switch">
                <input type="checkbox" name="hide_amounts" id="hideAmounts">
                <span></span>
            </span>
        </label>

        <button type="submit" class="btn">Sign in</button>
    </form>

    {% if error %}<div class="error" role="alert">⚠️ {{ error }}</div>{% endif %}

    <div class="foot">Secured by AGE</div>
</main>

<script>
    const pw = document.getElementById('password');
    document.getElementById('peek').addEventListener('click', e => {
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        e.currentTarget.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        pw.focus();
    });
    const hide = document.getElementById('hideAmounts');
    const row = document.getElementById('privacyRow');
    const sync = () => row.classList.toggle('on', hide.checked);
    hide.addEventListener('change', sync);
    sync();
</script>
</body>
</html>
